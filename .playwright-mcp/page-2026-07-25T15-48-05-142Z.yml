              - /url: https://www.nowyrelaks.fi-invest.pl/
              - img "Strona inwestycji Nowy Relaks zaprojektowana przez WeUnite" [ref=f7e84]
            - generic [ref=f7e85]:
              - text: Deweloper
              - heading "Nowy Relaks — Filipek Investment" [level=3] [ref=f7e86]
              - paragraph [ref=f7e87]: "Nowy Relaks to inwestycja domów jednorodzinnych pod Białą Podlaską, prowadzona przez dewelopera Filipek Investment. Wcześniej firma korzystała z darmowego szablonu, który nie budował zaufania i nie prezentował oferty w sposób, na jaki inwestycja zasługuje. Zaprojektowaliśmy i wdrożyliśmy stronę od podstaw, z pełną prezentacją lokalizacji, etapów budowy oraz galerii wnętrz. Dodaliśmy przejrzysty formularz zapytań o dostępność konkretnych domów, trafiający wprost do zespołu sprzedaży. Efekt: nowocześniejszy wizerunek marki i więcej zapytań o zakup."
              - link "Zobacz stronę na żywo" [ref=f7e88] [cursor=pointer]:
                - /url: https://www.nowyrelaks.fi-invest.pl/
          - generic [ref=f7e92]:
            - link "Zobacz stronę Gdynia Padel Club (otwiera się w nowej karcie)" [ref=f7e93] [cursor=pointer]:
              - /url: https://www.gdyniapadelclub.pl/
              - img "Strona Gdynia Padel Club zaprojektowana przez WeUnite" [ref=f7e96]
            - generic [ref=f7e97]:
              - text: Klub sportowy
              - heading "Gdynia Padel Club" [level=3] [ref=f7e98]
              - paragraph [ref=f7e99]: "Gdynia Padel Club to klub sportowy w Gdyni, dla którego zbudowaliśmy stronę prezentującą korty i pełną ofertę zajęć. Kluczowym wyzwaniem było umożliwienie klientom szybkiej rezerwacji terminu bez telefonowania do recepcji. Wdrożyliśmy dynamiczny system rezerwacji online, zintegrowany z bieżącą dostępnością kortów. Strona prezentuje też cennik, wydarzenia i social media klubu w jednym miejscu. Efekt: mniej pracy administracyjnej dla zespołu i wygodniejsza ścieżka rezerwacji dla graczy."
              - link "Zobacz stronę na żywo" [ref=f7e100] [cursor=pointer]:
                - /url: https://www.gdyniapadelclub.pl/
