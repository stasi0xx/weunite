        - paragraph [ref=f13e42]: "Nasz proces w 3 krokach:"
        - generic [ref=f13e43]:
          - generic [ref=f13e44]:
            - generic [ref=f13e45]: "01"
            - heading "Audyt i Architektura Konwersji" [level=3] [ref=f13e51]
            - paragraph [ref=f13e52]: Nie zaczynamy od designu. Najpierw analizujemy Twoją grupę docelową i projektujemy makietę UX tak, aby każdy element strony prowadził klienta za rękę do zakupu lub zostawienia leada.
          - generic [ref=f13e53]:
            - generic [ref=f13e54]: "02"
            - heading "Design i Wdrożenie Technologiczne" [level=3] [ref=f13e61]
            - paragraph [ref=f13e62]: Kodujemy szybkie, responsywne i nowoczesne strony. Łączymy estetykę z bezbłędną optymalizacją techniczną (szybkość ładowania, Core Web Vitals).
          - generic [ref=f13e63]:
            - generic [ref=f13e64]: "03"
            - heading "Automatyzacja i Skalowanie" [level=3] [ref=f13e69]
            - paragraph [ref=f13e70]: Strona to dopiero początek. Wpinamy analitykę, systemy CRM i automatyzacje mailowe, dzięki którym Twój nowy ekosystem pracuje na Ciebie 24/7.
